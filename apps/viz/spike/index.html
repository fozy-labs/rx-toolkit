<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>statechart-viz — mermaid SVG scheme spike</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 16px; }
      section { border: 1px solid #ccc; margin-bottom: 16px; padding: 8px; }
      .node.active rect, .node.active path { stroke: #d00 !important; stroke-width: 3px !important; }
      .statediagram-cluster.active rect.outer { stroke: #d00 !important; stroke-width: 3px !important; }
      pre { font-size: 12px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h1>Mermaid SVG scheme spike</h1>
    <p>
      Renders the proposal's <code>trafficLight</code> and <code>square</code> diagrams plus a parallel fixture with
      mermaid pinned in <code>apps/viz</code>. Results are exposed on <code>window.__spike</code>; the findings are
      recorded in <code>docs/svg-scheme.md</code>.
    </p>
    <div id="out"></div>
    <script type="module">
      import mermaid from "mermaid";

      const diagrams = {
        trafficLight: `stateDiagram-v2
    %% @machine trafficLight
    %% @context type: { power: boolean; retries: number }
    %% @context initial: { power: true, retries: 0 }

    [*] --> off

    %% @guard hasPower: context.power
    %% @action logStart: console.log("start")
    off --> working: POWER_ON [hasPower] / logStart
    working --> off: POWER_OFF
    working --> broken: done

    %% @action retry: context.retries += 1
    broken --> off: RESET / retry

    state working {
        [*] --> green
        green --> yellow: after 3000
        %% @action warn: console.warn("yellow -> red")
        yellow --> red: after 1000 / warn
        red --> green: after 3000
        red --> [*]: FAULT
    }
`,
        square: `stateDiagram-v2
    %% @machine square
    %% @context type: { result: number | null; error: string | null }
    %% @context initial: { result: null, error: null }
    %% @event SQUARE: { value: number }

    [*] --> idle

    %% @guard isFinite: Number.isFinite(event.value)
    %% @action square:
    %%     context.result = event.value ** 2
    %%     context.error = null
    idle --> done: SQUARE [isFinite] / square

    %% @action reject: context.error = "not a finite number"
    idle --> error: SQUARE / reject

    %% @action clear:
    %%     context.result = null
    %%     context.error = null
    done --> idle: RESET / clear
    error --> idle: RESET / clear
`,
        parallel: `stateDiagram-v2
    %% @machine parallelDemo
    [*] --> idle
    idle --> p: START
    state p {
        [*] --> a
        a --> b: NEXT_A
        b --> [*]: FIN_A
        --
        [*] --> c
        c --> d: NEXT_C
        d --> [*]: FIN_C
    }
    p --> idle: STOP
    p --> finished: done
    state "All regions finished" as finished
    state c1 <<choice>>
    finished --> c1: CHECK
    c1 --> idle: [ok]
    c1 --> p: [retry]
`,
      };

      const securityLevel = new URLSearchParams(location.search).get("securityLevel") ?? "strict";
      mermaid.initialize({ startOnLoad: false, securityLevel });

      const describe = (el) => {
        const attrs = {};
        for (const a of el.attributes) {
          if (a.name === "style" || a.name === "d" || a.name === "transform" || a.name === "data-points") continue;
          attrs[a.name] = a.value;
        }
        return { tag: el.tagName, attrs, text: el.textContent.trim().slice(0, 60) };
      };

      const results = { securityLevel, version: mermaid.version?.() ?? null, diagrams: {} };
      const out = document.getElementById("out");

      for (const [name, text] of Object.entries(diagrams)) {
        const section = document.createElement("section");
        section.innerHTML = `<h2>${name}</h2><div class="diagram" id="host-${name}"></div>`;
        out.appendChild(section);
        const host = section.querySelector(".diagram");
        const entry = { error: null };
        results.diagrams[name] = entry;
        try {
          const diagram = await mermaid.mermaidAPI.getDiagramFromText(text);
          const data = diagram.db.getData();
          entry.db = {
            nodes: data.nodes.map((n) => ({ id: n.id, label: n.label, parentId: n.parentId, isGroup: n.isGroup, shape: n.shape, domId: n.domId, type: n.type })),
            edges: data.edges.map((e) => ({ id: e.id, start: e.start, end: e.end, label: e.label, type: e.type })),
          };
          const { svg, bindFunctions } = await mermaid.render(`svg-${name}`, text);
          host.innerHTML = svg;
          bindFunctions?.(host);
          const svgEl = host.querySelector("svg");
          entry.svgAttrs = describe(svgEl).attrs;
          entry.nodes = [...svgEl.querySelectorAll("g.node")].map((g) => ({
            ...describe(g),
            children: [...g.children].map((c) => describe(c)),
          }));
          entry.clusters = [...svgEl.querySelectorAll("g.cluster")].map((g) => ({
            ...describe(g),
            children: [...g.children].map((c) => describe(c)),
          }));
          entry.edgePaths = [...svgEl.querySelectorAll("path.transition, g.edgePaths > path, .edgePaths path")].map(describe);
          entry.edgeLabels = [...svgEl.querySelectorAll("g.edgeLabel")].map((g) => ({
            ...describe(g),
            inner: [...g.querySelectorAll("[data-id], [id], span, foreignObject")].map(describe),
          }));
          entry.topLevelGroups = [...svgEl.querySelectorAll("svg > g")].map(describe);
          entry.allIds = [...svgEl.querySelectorAll("[id]")].map((e) => e.id);
        } catch (e) {
          entry.error = String(e?.stack ?? e);
          host.textContent = entry.error;
        }
      }

      window.__spike = results;
      window.__mermaid = mermaid;
      document.body.dataset.ready = "1";
    </script>
  </body>
</html>
